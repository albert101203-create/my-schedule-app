<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6256e8" />
    <meta name="description" content="시간별로 한 주를 한눈에 보는 주간 스케줄 앱" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>나의 시간표</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <h1>나의 시간표</h1>
      </header>

      <nav class="view-tabs" aria-label="보기 전환">
        <button class="tab active" type="button" data-view="week">주간 시간표</button>
        <button class="tab" type="button" data-view="agenda">일정 목록</button>
      </nav>

      <section id="weekView" class="view">
        <div class="week-scroll" id="weekScroll" tabindex="0" aria-label="일요일부터 토요일까지의 주간 시간표">
          <div class="week-grid" id="weekGrid"></div>
        </div>
        <p class="scroll-hint">빈 칸을 위아래로 드래그해 일정을 추가하세요</p>
      </section>

      <section id="agendaView" class="view hidden">
        <div class="section-heading">
          <h2>일정 목록</h2>
        </div>
        <div id="scheduleList" class="schedule-list" aria-live="polite"></div>
      </section>
    </main>

    <button class="add-button" id="openAddModal" type="button" aria-label="일정 추가"><span>＋</span> 일정 추가</button>

    <dialog id="scheduleDialog" class="schedule-dialog">
      <form id="scheduleForm" method="dialog">
        <div class="dialog-header">
          <h2 id="dialogTitle">새 일정</h2>
          <button class="icon-button small" id="closeDialog" type="button" aria-label="닫기">×</button>
        </div>
        <label>일정 이름<input id="titleInput" name="title" type="text" maxlength="60" placeholder="예: 수학 학원" required autocomplete="off" /></label>
        <label>요일
          <select id="dayInput" name="day" required>
            <option value="0">일요일</option><option value="1">월요일</option><option value="2">화요일</option><option value="3">수요일</option><option value="4">목요일</option><option value="5">금요일</option><option value="6">토요일</option>
          </select>
        </label>
        <div class="form-row">
          <label>시작 시간<input id="timeInput" name="time" type="time" required /></label>
          <label>종료 시간<select id="endTimeInput" name="endTime" required></select></label>
        </div>
        <label>일정 색상
          <span class="color-chooser">
            <span class="color-presets" id="colorPresets">
              <button class="color-swatch" type="button" data-color="#4d79e8" aria-label="파랑" style="--swatch:#4d79e8"></button>
              <button class="color-swatch" type="button" data-color="#765ce6" aria-label="보라" style="--swatch:#765ce6"></button>
              <button class="color-swatch" type="button" data-color="#db6290" aria-label="분홍" style="--swatch:#db6290"></button>
              <button class="color-swatch" type="button" data-color="#18a87a" aria-label="초록" style="--swatch:#18a87a"></button>
              <button class="color-swatch" type="button" data-color="#ef9c3a" aria-label="주황" style="--swatch:#ef9c3a"></button>
              <button class="color-swatch" type="button" data-color="#e95555" aria-label="빨강" style="--swatch:#e95555"></button>
              <button class="color-swatch" type="button" data-color="#16a6b6" aria-label="청록" style="--swatch:#16a6b6"></button>
              <button class="color-swatch custom-swatch" id="customColorButton" type="button" aria-label="사용자 지정 색상">＋</button>
            </span>
            <select id="matchColorSelect" class="match-color-select" aria-label="다른 일정과 같은 색 사용"></select>
            <span class="color-caption">색을 누르거나, 색깔별로 묶인 기존 일정에서 골라보세요.</span>
            <input id="colorInput" name="color" class="hidden-color-input" type="color" value="#4d79e8" />
          </span>
        </label>
        <label>세부 시간표 <span class="optional">선택</span><textarea id="detailsInput" name="details" rows="4" maxlength="600" placeholder="예:&#10;09:00 국어&#10;10:00 수학&#10;11:00 영어"></textarea></label>
        <label>메모 <span class="optional">선택</span><textarea id="noteInput" name="note" rows="2" maxlength="160" placeholder="장소나 준비물을 적어보세요"></textarea></label>
        <div class="dialog-actions">
          <button class="delete-button hidden" id="deleteSchedule" type="button">삭제</button>
          <button class="save-button" type="submit">저장하기</button>
        </div>
      </form>
    </dialog>

    <dialog id="detailDialog" class="detail-dialog">
      <section class="detail-panel">
        <div class="dialog-header">
          <div>
            <h2 id="detailTitle">세부 시간표</h2>
            <p id="detailMeta" class="detail-meta"></p>
          </div>
          <button class="icon-button small" id="closeDetailDialog" type="button" aria-label="닫기">×</button>
        </div>
        <div id="detailSchedule" class="detail-schedule"></div>
        <p id="detailNote" class="detail-note hidden"></p>
        <div class="dialog-actions">
          <button class="save-button" id="editFromDetail" type="button">수정하기</button>
        </div>
      </section>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
