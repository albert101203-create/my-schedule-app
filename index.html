<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6256e8" />
    <meta name="description" content="시간별로 한 주를 한눈에 보는 주간 스케줄 앱" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="stylesheet" href="style.css" />
    <title>나의 주간 스케줄</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow" id="todayLabel">매주 반복</p>
          <h1>나의 주간 시간표</h1>
        </div>
        <button class="icon-button" id="jumpToday" type="button" aria-label="오늘 요일로 이동" title="오늘 요일로 이동">◉</button>
      </header>

      <section class="summary-card" aria-label="반복 일정 요약">
        <div class="summary-date" id="summaryDate"></div>
        <div><strong id="weekCount">0</strong><span>개의 일정 · <b id="weekHours">0</b>시간</span></div>
        <p id="nextSchedule">매주 반복할 첫 일정을 추가해 보세요.</p>
      </section>

      <nav class="view-tabs" aria-label="보기 전환">
        <button class="tab active" type="button" data-view="week">주간 시간표</button>
        <button class="tab" type="button" data-view="agenda">일정 목록</button>
      </nav>

      <section id="weekView" class="view">
        <div class="week-toolbar static-week">
          <div>
            <h2 id="weekTitle">월 · 화 · 수 · 목 · 금 · 토 · 일</h2>
            <p>한 번 작성하면 매주 그대로 반복돼요 · 위아래로 드래그해 시간 선택</p>
          </div>
        </div>
        <div class="week-scroll" id="weekScroll" tabindex="0" aria-label="주간 시간표, 좌우로 밀어서 요일 확인">
          <div class="week-grid" id="weekGrid"></div>
        </div>
        <p class="scroll-hint">← 좌우로 요일 이동 · 위아래 드래그로 시간 선택 →</p>
      </section>

      <section id="agendaView" class="view hidden">
        <div class="section-heading">
          <h2>매주 반복 일정</h2>
          <button class="text-button" id="filterButton" type="button">전체 보기</button>
        </div>
        <div id="scheduleList" class="schedule-list" aria-live="polite"></div>
      </section>
    </main>

    <button class="add-button" id="openAddModal" type="button" aria-label="일정 추가"><span>＋</span> 일정 추가</button>

    <dialog id="scheduleDialog" class="schedule-dialog">
      <form id="scheduleForm" method="dialog">
        <div class="dialog-header">
          <h2 id="dialogTitle">새 일정</h2>
          <button class="icon-button small" id="closeDialog" type="button" aria-label="닫기">×</button>
        </div>
        <label>일정 이름<input id="titleInput" name="title" type="text" maxlength="60" placeholder="예: 수학 학원" required autocomplete="off" /></label>
        <label>요일
          <select id="dayInput" name="day" required>
            <option value="0">월요일</option><option value="1">화요일</option><option value="2">수요일</option><option value="3">목요일</option><option value="4">금요일</option><option value="5">토요일</option><option value="6">일요일</option>
          </select>
        </label>
        <div class="form-row">
          <label>시작 시간<input id="timeInput" name="time" type="time" required /></label>
          <label>종료 시간<input id="endTimeInput" name="endTime" type="time" required /></label>
        </div>
        <label>분류
          <select id="categoryInput" name="category">
            <option value="school">학교</option><option value="study">공부</option><option value="personal">개인</option><option value="health">운동</option><option value="other">기타</option>
          </select>
        </label>
        <label>메모 <span class="optional">선택</span><textarea id="noteInput" name="note" rows="3" maxlength="160" placeholder="장소나 준비물을 적어보세요"></textarea></label>
        <div class="dialog-actions">
          <button class="delete-button hidden" id="deleteSchedule" type="button">삭제</button>
          <button class="save-button" type="submit">저장하기</button>
        </div>
      </form>
    </dialog>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
